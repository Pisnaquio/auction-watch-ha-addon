version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /auctionwatch
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /auctionwatch/web
    schedule:
      interval: weekly
    # Packages with mutual peer dependencies must move in the same PR,
    # otherwise each bump fails `npm ci` on its own.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
